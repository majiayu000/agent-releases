name = "agent-releases"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[triggers]
crons = ["17 * * * *"]

[vars]
DRY_RUN = "true"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "agent-releases"
# Replace with the ID returned by `wrangler d1 create agent-releases` before deployment.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
