name: smoke LLM draft

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Smoke LLM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          DRAFT_MODEL: ${{ secrets.DRAFT_MODEL }}
          DRAFT_TIMEOUT_MS: ${{ secrets.DRAFT_TIMEOUT_MS }}
          DRAFT_MAX_TOKENS: ${{ secrets.DRAFT_MAX_TOKENS }}
          DRAFT_THINKING: ${{ secrets.DRAFT_THINKING }}
        run: bun run src/smoke-llm.ts
