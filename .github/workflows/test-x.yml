name: preview X text

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Text to preview (never posts)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Preview text
        env:
          TEST_TWEET_TEXT: ${{ github.event.inputs.text }}
        run: bun run src/test-x.ts
