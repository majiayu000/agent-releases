name: post X once

# One-shot manual publisher for @agentreleases. Prefer POST via file for long text.
# Optional media: comma-separated repo-relative image paths (attached to root tweet only).
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Repo-relative UTF-8 text file to post"
        required: true
        type: string
        default: "scripts/one-shot/plugin-eval-long.txt"
      media:
        description: "Optional comma-separated image paths (root tweet only, max 4)"
        required: false
        type: string
        default: ""

concurrency:
  group: agent-releases
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Post once to X
        env:
          POST_FILE: ${{ inputs.file }}
          POST_MEDIA: ${{ inputs.media }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: bun run src/post-once.ts
