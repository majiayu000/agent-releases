name: agent-releases hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (true=Issue only, false=post to X)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: agent-releases
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile || bun install

      - name: Selfcheck
        run: bun run selfcheck:draft

      - name: Generate drafts / post
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          DRAFT_MODEL: ${{ secrets.DRAFT_MODEL }}
        run: bun run start

      # Persist state even when one product fails (e.g. grok parse), so
      # successful posts (claude/codex) do not re-fire next hour.
      - name: Commit state
        if: always()
        run: |
          git config user.name "agent-releases-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Must include .state/ (last_posted_*.txt + posted.jsonl ledger)
          git add .state || true
          if git diff --staged --quiet; then
            echo "No state changes"
          else
            git commit -m "chore: advance release state"
            # Rebase retry if another run pushed state concurrently
            pushed=0
            for i in 1 2; do
              if git push; then
                pushed=1
                break
              fi
              echo "push failed, fetch + rebase retry #$i"
              git fetch origin main
              git rebase origin/main
            done
            if [ "$pushed" -ne 1 ]; then
              git push
            fi
          fi
